[package]
name = "capcap"
version = "0.1.0"
edition = "2021"
description = "Zero-cloud, local-first video captioning, translation & container muxing"
license = "MIT"
repository = "https://github.com/matheusbuniotto/caption-captain"

[lib]
name = "capcap"
path = "src/lib.rs"

[[bin]]
name = "capcap"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4", features = ["derive"] }
ffmpeg-sidecar = "2.5.2"
hound = "3.5.1"
tempfile = "3.27.0"
whisper-rs = "0.16.0"

[build-dependencies]
sha2 = "0.11.0"
ureq = "3.4.1"

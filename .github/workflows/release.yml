name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            name: capcap-macos-arm64
            ffmpeg_url: https://www.osxexperts.net/ffmpeg80arm.zip
          - os: macos-latest
            target: x86_64-apple-darwin
            name: capcap-macos-x86_64
            ffmpeg_url: https://evermeet.cx/ffmpeg/getrelease/zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: capcap-linux-x86_64
            ffmpeg_url: https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: capcap-windows-x86_64
            ffmpeg_url: https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: target/model-cache
          key: whisper-tiny-q5_1-${{ runner.os }}
      - run: cargo build --release --target ${{ matrix.target }}

      # Downloads the same static ffmpeg binary ffmpeg-sidecar would fetch
      # at runtime, and places it next to the capcap binary before packaging,
      # so a released binary never needs network access to get ffmpeg.
      - name: Provision bundled ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -fsSL "${{ matrix.ffmpeg_url }}" -o ffmpeg.zip
          unzip -o ffmpeg.zip -d target/${{ matrix.target }}/release
          chmod +x target/${{ matrix.target }}/release/ffmpeg
      - name: Provision bundled ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL "${{ matrix.ffmpeg_url }}" -o ffmpeg.tar.xz
          tar xJf ffmpeg.tar.xz
          mv ffmpeg-*-static/ffmpeg target/${{ matrix.target }}/release/ffmpeg
          chmod +x target/${{ matrix.target }}/release/ffmpeg
      - name: Provision bundled ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -fsSL "${{ matrix.ffmpeg_url }}" -o ffmpeg.zip
          unzip -o ffmpeg.zip -d ffmpeg-extracted
          find ffmpeg-extracted -name ffmpeg.exe -exec cp {} target/${{ matrix.target }}/release/ffmpeg.exe \;

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ${{ github.workspace }}/${{ matrix.name }}.tar.gz capcap ffmpeg
      - name: Package (windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ${{ github.workspace }}/${{ matrix.name }}.zip capcap.exe ffmpeg.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ github.workspace }}/${{ matrix.name }}.tar.gz
            ${{ github.workspace }}/${{ matrix.name }}.zip
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Render install.sh
        run: |
          sed "s/@VERSION@/${GITHUB_REF_NAME}/" scripts/install.sh.tmpl > dist/install.sh
          chmod +x dist/install.sh

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      - name: Update Homebrew formula
        run: |
          version="${GITHUB_REF_NAME#v}"

          sed -i "s/version \"[0-9.]*\"/version \"${version}\"/" Formula/capcap.rb

          for asset in capcap-macos-arm64 capcap-macos-x86_64 capcap-linux-x86_64; do
            sha=$(awk -v a="$asset" '$0 ~ a".tar.gz" {print $1}' dist/checksums.txt)
            sed -i \
              -e "s#download/v[0-9.]*/${asset}.tar.gz#download/${GITHUB_REF_NAME}/${asset}.tar.gz#" \
              Formula/capcap.rb
            awk -v asset="$asset" -v sha="$sha" \
              '$0 ~ asset {f=1} f && /sha256/ {sub(/"[a-f0-9]*"/, "\"" sha "\""); f=0} {print}' \
              Formula/capcap.rb > /tmp/formula.rb && mv /tmp/formula.rb Formula/capcap.rb
          done

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/capcap.rb
          git commit -m "Update Homebrew formula for ${GITHUB_REF_NAME}"
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master

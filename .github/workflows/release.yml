name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  WHISPER_NATIVE: "OFF"
  GGML_NATIVE: "OFF"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            name: capcap-macos-arm64
            ffmpeg_url: https://www.osxexperts.net/ffmpeg80arm.zip
          - os: macos-latest
            target: x86_64-apple-darwin
            name: capcap-macos-x86_64
            ffmpeg_url: https://evermeet.cx/ffmpeg/getrelease/zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: capcap-linux-x86_64
            ffmpeg_url: https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: capcap-windows-x86_64
            ffmpeg_url: https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
      - uses: actions/cache@v4
        with:
          path: target/model-cache
          key: whisper-tiny-q5_1-${{ runner.os }}
      - run: cargo build --release --target ${{ matrix.target }}

      # Downloads the same static ffmpeg binary ffmpeg-sidecar would fetch
      # at runtime, and places it next to the capcap binary before packaging,
      # so a released binary never needs network access to get ffmpeg.
      - name: Provision bundled ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -fsSL "${{ matrix.ffmpeg_url }}" -o ffmpeg.zip
          unzip -o ffmpeg.zip -d target/${{ matrix.target }}/release
          chmod +x target/${{ matrix.target }}/release/ffmpeg
      - name: Provision bundled ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL "${{ matrix.ffmpeg_url }}" -o ffmpeg.tar.xz
          tar xJf ffmpeg.tar.xz
          mv ffmpeg-*-static/ffmpeg target/${{ matrix.target }}/release/ffmpeg
          chmod +x target/${{ matrix.target }}/release/ffmpeg
      - name: Provision bundled ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -fsSL "${{ matrix.ffmpeg_url }}" -o ffmpeg.zip
          unzip -o ffmpeg.zip -d ffmpeg-extracted
          find ffmpeg-extracted -name ffmpeg.exe -exec cp {} target/${{ matrix.target }}/release/ffmpeg.exe \;

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ${{ github.workspace }}/${{ matrix.name }}.tar.gz capcap ffmpeg
      - name: Package (windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ${{ github.workspace }}/${{ matrix.name }}.zip capcap.exe ffmpeg.exe
          cp capcap.exe ${{ github.workspace }}/${{ matrix.name }}.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ github.workspace }}/${{ matrix.name }}.tar.gz
            ${{ github.workspace }}/${{ matrix.name }}.zip
            ${{ github.workspace }}/${{ matrix.name }}.exe
          if-no-files-found: ignore

  build-gui:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            name: capcap-gui-macos-arm64
            ffmpeg_url: https://www.osxexperts.net/ffmpeg80arm.zip
          - os: macos-latest
            target: x86_64-apple-darwin
            name: capcap-gui-macos-x86_64
            ffmpeg_url: https://evermeet.cx/ffmpeg/getrelease/zip
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: capcap-gui-windows-x86_64
            ffmpeg_url: https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          workspaces: gui/src-tauri
      - uses: actions/cache@v4
        with:
          path: target/model-cache
          key: whisper-tiny-q5_1-${{ runner.os }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: npm ci
        working-directory: gui
        run: npm ci

      # Unsigned, per this ticket's scope (no Apple Developer cert yet) --
      # `--bundles app` only on macOS, since the ffmpeg binary still needs to be
      # dropped into the .app below before the .dmg is made.
      - name: tauri build (macOS, release, unsigned, app only)
        if: runner.os == 'macOS'
        working-directory: gui
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles app

      - name: tauri build (Windows, release)
        if: runner.os == 'Windows'
        working-directory: gui
        shell: bash
        run: |
          npm run tauri build -- --target ${{ matrix.target }} --bundles nsis || npm run tauri build -- --target ${{ matrix.target }} --no-bundle

      # Provision statically-fetched ffmpeg binary next to the app's executable.
      - name: Provision bundled ffmpeg into the .app (macOS)
        if: runner.os == 'macOS'
        run: |
          app_dir="gui/src-tauri/target/${{ matrix.target }}/release/bundle/macos/Capcap.app/Contents/MacOS"
          curl -fsSL "${{ matrix.ffmpeg_url }}" -o ffmpeg.zip
          unzip -o ffmpeg.zip -d "$app_dir"
          chmod +x "$app_dir/ffmpeg"

      - name: Provision bundled ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          rel_dir="gui/src-tauri/target/${{ matrix.target }}/release"
          curl -fsSL "${{ matrix.ffmpeg_url }}" -o ffmpeg.zip
          unzip -o ffmpeg.zip -d ffmpeg-extracted
          find ffmpeg-extracted -name ffmpeg.exe -exec cp {} "$rel_dir/ffmpeg.exe" \;

      - name: Package .dmg (macOS)
        if: runner.os == 'macOS'
        run: |
          bundle_dir="gui/src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          hdiutil create -volname Capcap -srcfolder "$bundle_dir/Capcap.app" \
            -ov -format UDZO "${{ github.workspace }}/${{ matrix.name }}.dmg"

      - name: Package .app (macOS, zipped)
        if: runner.os == 'macOS'
        run: |
          bundle_dir="gui/src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          ditto -c -k --keepParent "$bundle_dir/Capcap.app" \
            "${{ github.workspace }}/${{ matrix.name }}.app.zip"

      - name: Package Windows GUI (.exe and .zip)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          rel_dir="gui/src-tauri/target/${{ matrix.target }}/release"
          cp "$rel_dir/capcap-gui.exe" "${{ github.workspace }}/${{ matrix.name }}.exe"
          (cd "$rel_dir" && 7z a "${{ github.workspace }}/${{ matrix.name }}.zip" capcap-gui.exe ffmpeg.exe)
          if [ -d "$rel_dir/bundle/nsis" ]; then
            find "$rel_dir/bundle/nsis" -name "*.exe" -exec cp {} "${{ github.workspace }}/${{ matrix.name }}-setup.exe" \;
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ github.workspace }}/${{ matrix.name }}.dmg
            ${{ github.workspace }}/${{ matrix.name }}.app.zip
            ${{ github.workspace }}/${{ matrix.name }}.zip
            ${{ github.workspace }}/${{ matrix.name }}.exe
            ${{ github.workspace }}/${{ matrix.name }}-setup.exe
          if-no-files-found: ignore

  release:
    needs: [build, build-gui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Render install.sh
        run: |
          sed "s/@VERSION@/${GITHUB_REF_NAME}/" scripts/install.sh.tmpl > dist/install.sh
          chmod +x dist/install.sh

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ### Desktop App (GUI)
            - **macOS (`capcap-gui-macos-*.dmg` / `capcap-gui-macos-*.app.zip`)**: Unsigned (no paid Apple Developer cert). Gatekeeper will block direct double-click on first run. To open: right-click (or Control-click) `Capcap.app` > **Open** > confirm **Open** in the dialog.
            - **Windows (`capcap-gui-windows-x86_64.exe` / `capcap-gui-windows-x86_64.zip`)**: Standalone `.exe` or bundled offline zip with `ffmpeg.exe`.

            ### Command Line (CLI)
            - macOS: `capcap-macos-*.tar.gz` (or `brew install matheusbuniotto/caption-captain/capcap`)
            - Linux: `capcap-linux-x86_64.tar.gz`
            - Windows: `capcap-windows-x86_64.exe` / `capcap-windows-x86_64.zip`

      - name: Update Homebrew formula and cask
        run: |
          version="${GITHUB_REF_NAME#v}"

          sed -i "s/version \"[0-9.]*\"/version \"${version}\"/" Formula/capcap.rb

          for asset in capcap-macos-arm64 capcap-macos-x86_64 capcap-linux-x86_64; do
            sha=$(awk -v a="$asset" '$0 ~ a".tar.gz" {print $1}' dist/checksums.txt)
            sed -i \
              -e "s#download/v[0-9.]*/${asset}.tar.gz#download/${GITHUB_REF_NAME}/${asset}.tar.gz#" \
              Formula/capcap.rb
            awk -v asset="$asset" -v sha="$sha" \
              '$0 ~ asset {f=1} f && /sha256/ {sub(/"[a-f0-9]*"/, "\"" sha "\""); f=0} {print}' \
              Formula/capcap.rb > /tmp/formula.rb && mv /tmp/formula.rb Formula/capcap.rb
          done

          if [ -f Casks/capcap.rb ]; then
            sed -i "s/version \"[0-9.]*\"/version \"${version}\"/" Casks/capcap.rb
            for asset in capcap-gui-macos-arm64 capcap-gui-macos-x86_64; do
              sha=$(awk -v a="$asset" '$0 ~ a".dmg" {print $1}' dist/checksums.txt)
              sed -i \
                -e "s#download/v[0-9.]*/${asset}.dmg#download/${GITHUB_REF_NAME}/${asset}.dmg#" \
                Casks/capcap.rb
              awk -v asset="$asset" -v sha="$sha" \
                '$0 ~ asset {f=1} f && /sha256/ {sub(/"[a-f0-9]*"/, "\"" sha "\""); f=0} {print}' \
                Casks/capcap.rb > /tmp/cask.rb && mv /tmp/cask.rb Casks/capcap.rb
            done
            git add Casks/capcap.rb
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/capcap.rb
          git commit -m "Update Homebrew formula and cask for ${GITHUB_REF_NAME}"
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master
